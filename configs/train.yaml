data:
  train_audio_root: "data/train/audio"
  train_image_root: "data/train/images"
  validation_audio_root: "data/validation/audio"
  validation_image_root: "data/validation/images"
  class_names: ["0", "1"]
  image_size: 224
  audio_length: 100

loader:
  train_batch_size: 12
  validation_batch_size: 12
  workers: 8
  prefetch_factor: 2
  pin_memory: true

model:
  image_width_multiplier: 0.5
  fusion_dimension: 256

training:
  seed: 0
  device: "auto"
  epochs: 100
  maximum_learning_rate: 0.01
  minimum_learning_rate: 0.00001
  warmup_iterations: 500
  warmup_initial_learning_rate: 0.000001
  momentum: 0.9
  nesterov: true
  weight_decay: 0.0001
  label_smoothing: 0.1
  mixed_precision: true
  channels_last: true
  gradient_clip: 10.0
  ema_enabled: true
  ema_momentum: 0.0005
  log_frequency: 50
  output_directory: "runs/cvc_fusion"
